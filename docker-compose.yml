version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: sqlserver-api-animais
    environment:
      SA_PASSWORD: "1q2w3e4R@"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "1q2w3e4R@", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - api-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-animais
    ports:
      - "8080:8080"
    environment:
      DB_SERVER_URL: sqlserver
      DB_SERVER_PORT: 1433
      DB_SCHEMA: apiAnimais
      DB_USER: sa
      DB_PWD: "1q2w3e4R@"
      SPRING_PROFILES_ACTIVE: dev
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - api-network
    restart: on-failure

volumes:
  sqlserver_data:

networks:
  api-network:
    driver: bridge
