spring.application.name=apiAnimais
server.port=8080

springdoc.swagger-ui.path=/
api.version=v1

# Database - SQL Server (Local Development)
# Para conectar a um SQL Server local:
# - Altere localhost para o IP/hostname do seu servidor SQL Server
# - Altere 1433 para a porta do SQL Server (padrão é 1433)
# - Altere sa e a senha conforme suas credenciais
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=apiAnimais;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=1q2w3e4R@
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
